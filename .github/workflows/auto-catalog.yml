# EAGLE auto-catalog - zero-command publishing for After-Effect-HUB.
#
# ONE-TIME SETUP (two-repo layout)
# --------------------------------
# You have TWO repos:
#   - AdobePlugins      : holds the releases (the .zip assets live here)
#   - After-Effect-HUB  : holds catalog.json (what EAGLE fetches)
#
# This workflow file goes in the ASSET repo (AdobePlugins), because that is
# the repo whose `release` events must trigger it. A workflow placed in
# After-Effect-HUB would never see AdobePlugins' releases.
#
# Steps:
#   1. Create a fine-grained PAT with Contents: Read and write on
#      After-Effect-HUB  (GitHub -> Settings -> Developer settings ->
#      Personal access tokens -> Fine-grained tokens -> Generate). Copy it.
#   2. In AdobePlugins -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> Name: CATALOG_TOKEN -> paste the PAT.
#   3. (Optional) AdobePlugins -> Variables -> New variable ->
#      Name: CATALOG_REPO -> Value: <owner>/After-Effect-HUB. Skip this if
#      your GitHub username is "dj" (the default below already matches).
#   4. Add this file at  .github/workflows/auto-catalog.yml  in AdobePlugins.
#   5. Publish a test release in AdobePlugins; ~30 s later the bot commits
#      catalog.json in After-Effect-HUB.
#
# The built-in GITHUB_TOKEN downloads AdobePlugins' own releases; the PAT
# is only used to check out and push to After-Effect-HUB.
#
# Single-repo alternative: if you ever merge the repos (move catalog.json
# into AdobePlugins), delete the `repository:` and `token:` lines from the
# checkout step, set `permissions: contents: write`, and you can drop the
# PAT entirely.
#
# FROM THEN ON, PUBLISHING = ZERO COMMANDS
# ----------------------------------------
#   1. GitHub -> Releases -> "Draft a new release"
#   2. Tag it, e.g.  v1.4.3   (conventions below)
#   3. Attach your .zip file(s), click "Publish release"
#   4. ~30 seconds later this workflow updates catalog.json for you
#      (commit author: github-actions[bot]). EAGLE -> Refresh shows it.
#   Delete or unpublish a release -> its catalog entries are removed
#      the same way. Still zero manual JSON edits, in either direction.
#
# HOW THE TYPE IS DETECTED (for every .zip in the release)
# --------------------------------------------------------
#   1. Tag prefix wins, if the tag starts with one of:
#        extension-...  -> extension (CEP, Common Files/Adobe/CEP/extensions)
#        plugin-...     -> plugin    (AE Plug-ins)
#        aeplugin-...   -> plugin    (AE Plug-ins)
#        script-...     -> script    (ScriptUI Panels)
#        core-...       -> plugin    (MediaCore)
#   2. Otherwise the workflow looks INSIDE the zip:
#        CSXS/manifest.xml present  -> extension (every CEP ext has it)
#        any .aex                   -> plugin
#        any .jsx / .jsxbin         -> script
#      (CSXS is checked first because extensions often bundle .jsx hosts)
#   3. Nothing matched -> plugin (aeplugin), with a note in the run log.
#
# NAME / VERSION / ID
# -------------------
#   tag "plugin-Chromabba-v1.4.3" + "Chromabba-1.4.3.zip"
#     -> id chromabba, name Chromabba, version 1.4.3
#   bare tag "v1.4.3" -> name/version come from each zip's filename, so
#     multi-zip releases work ("Bionic Blur 1.2.zip" -> "Bionic Blur" 1.2;
#     a version-less, prefix-less tag like "release" behaves the same)
#   Keep the base file name stable across versions ("Chromabba-1.4.3.zip"
#   -> "Chromabba-1.4.4.zip") so the SAME entry gets bumped instead of
#   duplicated. Bumps keep your hand-edited name/description/category/
#   tags; only version/last_updated/link/sha256/size_bytes are updated.
#   Existing entries are matched by id, then by the previous release
#   link's zip name, then by display name + category - so the bump lands
#   on the SAME entry even if your catalog id differs from the slug.
#
# REPLACES the older two-file setup: if you copied the previous
# update-catalog.yml + tools/update_catalog.py into After-Effect-HUB,
# delete BOTH before adding this one (two workflows must not both fire).

name: Auto catalog

on:
  release:
    types: [published, unpublished, deleted]

# contents:read is enough for the GITHUB_TOKEN to download AdobePlugins'
# own releases. Writing catalog.json to After-Effect-HUB goes through the
# PAT (CATALOG_TOKEN), which this permissions key does not scope.
permissions:
  contents: read

jobs:
  auto-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the catalog repo (After-Effect-HUB)
        uses: actions/checkout@v4
        with:
          # The catalog lives in a DIFFERENT repo than the releases.
          # CATALOG_REPO variable = "<owner>/After-Effect-HUB" (set it in
          # AdobePlugins -> Variables); defaults to dj/After-Effect-HUB.
          repository: ${{ vars.CATALOG_REPO || 'dj/After-Effect-HUB' }}
          # PAT with Contents:write on After-Effect-HUB (secret CATALOG_TOKEN
          # in AdobePlugins). Omit repository+token if you merge the repos.
          token: ${{ secrets.CATALOG_TOKEN }}

      - name: Download the release .zip assets
        if: ${{ github.event.action == 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --pattern '*.ZIP' \
            --clobber --dir "$RUNNER_TEMP/assets"
          ls -la "$RUNNER_TEMP/assets"

      - name: Add, update, or remove catalog entries
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/auto_catalog.py" <<'PYEOF'
          import datetime
          import glob
          import hashlib
          import json
          import os
          import re
          import sys
          import zipfile
          from urllib.parse import quote as url_quote

          ASSET_DIR = sys.argv[1]
          ACTION = os.environ.get("RELEASE_ACTION", "published").strip()
          TAG = os.environ.get("RELEASE_TAG", "").strip()
          REPO = os.environ.get("RELEASE_REPO", "").strip()
          CATALOG = "catalog.json"

          # Canonical key order matches src/catalog/fetch.h struct order.
          ENTRY_KEY_ORDER = [
              "id", "category", "name", "version", "last_updated",
              "link", "sha256", "size_bytes", "description", "tags",
              "plugin_type",
          ]

          # Tag prefixes that explicitly declare the package type.
          # Format: (prefix, category, plugin_type). First match wins.
          TAG_PREFIXES = [
              ("extension-", "extension", None),
              ("aeplugin-", "plugin", "aeplugin"),
              ("plugin-", "plugin", "aeplugin"),
              ("script-", "script", None),
              ("core-", "plugin", "core"),
          ]

          # Trailing version in a tag / filename:
          # "Chromabba-1.4.3", "v2.0", "Suite 16"
          VER_RE = re.compile(
              r"(?:^|[-_ ])(?:v|ver-?)?(\d+(?:\.\d+)*)\s*$", re.IGNORECASE)

          def sha256_of(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def load_catalog():
              if not os.path.exists(CATALOG):
                  print("note: catalog.json not found - creating a new one")
                  return [], None
              with open(CATALOG, "r", encoding="utf-8") as f:
                  data = json.load(f)
              if isinstance(data, list):
                  return data, None
              if isinstance(data, dict) and isinstance(data.get("items"), list):
                  return data["items"], data
              raise SystemExit(
                  "error: catalog.json is neither [...] nor {'items': [...]}")

          def save_catalog(items, wrapper):
              out = items if wrapper is None else {**wrapper, "items": items}
              with open(CATALOG, "w", encoding="utf-8") as f:
                  f.write(json.dumps(out, indent=2, ensure_ascii=False) + "\n")

          def sniff(zip_path):
              """Look INSIDE the zip to decide what kind of package it is.
              CEP extensions must ship CSXS/manifest.xml; AE plugins are
              .aex binaries; scripts are .jsx / .jsxbin files. CSXS is
              checked first because extensions often bundle .jsx hosts."""
              try:
                  with zipfile.ZipFile(zip_path) as z:
                      names = [n.lower().replace("\\", "/")
                               for n in z.namelist() if not n.endswith("/")]
              except zipfile.BadZipFile:
                  return None
              if any(n.endswith("csxs/manifest.xml") for n in names):
                  return "extension"
              if any(n.endswith(".aex") for n in names):
                  return "plugin"
              if any(n.endswith(".jsx") or n.endswith(".jsxbin")
                     for n in names):
                  return "script"
              return None

          def split_prefix(text):
              t = text.strip()
              for pfx, cat, ptype in TAG_PREFIXES:
                  if t.lower().startswith(pfx):
                      return cat, ptype, t[len(pfx):]
              return None, None, t

          def split_version(text):
              """'Chromabba-1.4.3' -> ('Chromabba', '1.4.3')
              'v2.0' -> ('', '2.0'); 'NeoGrade' -> ('NeoGrade', None)"""
              m = VER_RE.search(text)
              if not m:
                  return text.strip(" -_"), None
              return text[:m.start()].strip(" -_"), m.group(1)

          def display_name(raw):
              return re.sub(r"[-_]+", " ", raw).strip()

          def make_id(name):
              s = re.sub(r"[^a-z0-9]+", "-", name.lower()).strip("-")
              return s or "entry"

          def base_key(text):
              """Normalize a package name for comparison: lowercase, drop
              the version suffix, drop all non-alphanumerics. "Bionic
              Blur 1.2" and "bionic-blur-1.0" both -> "bionicblur"."""
              stem = re.sub(r"\.[A-Za-z0-9]{1,5}$", "", str(text))
              name, _ = split_version(stem)
              return re.sub(r"[^a-z0-9]+", "", (name or stem).lower())

          def find_entry(items, id_, base, category):
              # 1) exact id
              for e in items:
                  if isinstance(e, dict) and e.get("id") == id_:
                      return e, "id"
              # 2) the entry's previous release link carries the same zip
              #    base name (".../download/v1.3/Chromabba-1.3.zip" vs a
              #    new "Chromabba-1.4.3.zip") - strongest cross-version
              #    signal when the catalog id differs from the slug
              for e in items:
                  if not isinstance(e, dict):
                      continue
                  link = str(e.get("link", ""))
                  if "/releases/download/" not in link:
                      continue
                  fn = link.rsplit("/", 1)[-1]
                  if fn and base_key(fn) == base:
                      return e, "previous release link"
              # 3) same display name + same category (case/punct-insensitive)
              for e in items:
                  if (isinstance(e, dict)
                          and e.get("category") == category
                          and base_key(e.get("name", "")) == base):
                      return e, "name + category"
              return None, None

          def new_entry(id_, category, name, version, today, link, sha,
                        size, ptype):
              fields = {
                  "id": id_, "category": category, "name": name,
                  "version": version, "last_updated": today, "link": link,
                  "sha256": sha, "size_bytes": size,
                  "description": "", "tags": [], "plugin_type": ptype,
              }
              out = {}
              for k in ENTRY_KEY_ORDER:
                  v = fields[k]
                  if v in (None, "", [], {}):
                      continue
                  out[k] = v
              return out

          def remove_for_tag(items, tag):
              """Remove every catalog entry whose link points at this
              release's tag (handles both raw and URL-quoted tag forms
              so hand-built links and auto-generated ones both match)."""
              raw = "/releases/download/" + tag + "/"
              quoted = ("/releases/download/"
                        + url_quote(tag, safe="") + "/")
              kept, removed = [], []
              for e in items:
                  link = e.get("link") if isinstance(e, dict) else None
                  if (isinstance(link, str)
                          and (raw in link or quoted in link)):
                      removed.append(e)
                  else:
                      kept.append(e)
              return kept, removed

          def main():
              items, wrapper = load_catalog()

              # Release deleted or unpublished -> drop every entry that
              # still points at this release's tag. Entries already
              # bumped to a newer release keep pointing at the newer
              # tag, so they survive - correct: the package still ships.
              if ACTION in ("unpublished", "deleted"):
                  kept, removed = remove_for_tag(items, TAG)
                  if not removed:
                      print("release %s: no catalog entries point at "
                            "it - nothing to remove" % TAG)
                      return
                  for e in removed:
                      print("removed %s (was %s)"
                            % (e.get("id", "?"), e.get("link", "")))
                  save_catalog(kept, wrapper)
                  print("wrote %s (%d entr%s remain)"
                        % (CATALOG, len(kept),
                           "y" if len(kept) == 1 else "ies"))
                  return

              zips = sorted(p for p in glob.glob(os.path.join(ASSET_DIR, "*"))
                            if p.lower().endswith(".zip"))
              if not zips:
                  raise SystemExit(
                      "error: no .zip asset in this release - attach the "
                      "package as a .zip, then re-run the workflow")

              # A tag only claims the entry name when it clearly intends
              # to: it carries a category prefix ("plugin-Chromabba") or
              # a version ("Chromabba-1.4.3"). Any other tag ("release",
              # "first-build") stays neutral so each zip's own filename
              # decides name+version - this keeps multi-zip releases and
              # casual tag names from hijacking the entries.
              tcat, tptype, trest = split_prefix(TAG)
              tname, tver = split_version(trest)
              tag_named = bool(tname) and (tver is not None
                                           or tcat is not None)

              for zp in zips:
                  fname = os.path.basename(zp)
                  stem = re.sub(r"\.[A-Za-z0-9]{1,5}$", "", fname)
                  fn_name, fn_ver = split_version(stem)
                  if tag_named:
                      name = display_name(tname)
                      version = tver or fn_ver or "1.0.0"
                  else:
                      name = display_name(fn_name or stem)
                      version = fn_ver or tver or "1.0.0"
                  category = tcat or sniff(zp)
                  ptype = tptype
                  if category is None:
                      print("note: %s: type not detected from contents - "
                            "defaulting to plugin (use a tag prefix like "
                            "plugin-... to force one)" % fname)
                      category = "plugin"
                  if category == "plugin" and not ptype:
                      ptype = "aeplugin"
                  id_ = make_id(name)
                  link = ("https://github.com/" + REPO +
                          "/releases/download/" + url_quote(TAG, safe="") +
                          "/" + url_quote(fname, safe=""))
                  sha = sha256_of(zp)
                  size = os.path.getsize(zp)
                  today = datetime.date.today().isoformat()
                  print("detected %s -> %s%s id=%s v%s" % (
                      fname, category, "/" + ptype if ptype else "",
                      id_, version))

                  existing, how = find_entry(items, id_, base_key(stem),
                                             category)
                  if existing is not None:
                      old = existing.get("version", "?")
                      existing["version"] = version
                      existing["last_updated"] = today
                      existing["sha256"] = sha
                      existing["size_bytes"] = size
                      existing["link"] = link
                      print("bumped %s: %s -> %s (matched by %s; your "
                            "name/description/category/tags are preserved)"
                            % (existing.get("id", id_), old, version, how))
                  else:
                      items.append(new_entry(
                          id_, category, name, version, today, link, sha,
                          size, ptype))
                      print("added  %s %s" % (id_, version))

              save_catalog(items, wrapper)
              print("wrote %s (%d entr%s)"
                    % (CATALOG, len(items),
                       "y" if len(items) == 1 else "ies"))

          main()
          PYEOF
          python3 "$RUNNER_TEMP/auto_catalog.py" "$RUNNER_TEMP/assets"

      - name: Commit and push to the catalog repo
        env:
          RELEASE_ACTION: ${{ github.event.action }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json unchanged - nothing to commit"
          else
            if [ "$RELEASE_ACTION" = "published" ]; then
              git commit -m "auto-catalog: ${RELEASE_TAG}"
            else
              git commit -m "auto-catalog: removed ${RELEASE_TAG}"
            fi
            git push
          fi
